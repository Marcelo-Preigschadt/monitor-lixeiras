<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack - Monitoramento de Lixeiras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-green-500 text-white p-2.5 rounded-lg">
                    <i class="fa-solid fa-trash-can text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-900">EcoTrack</h1>
                    <p class="text-xs text-gray-500">Gestão Inteligente de Resíduos</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center justify-center gap-3 text-sm font-medium">
                <span id="status-sistema" class="flex items-center gap-1.5 bg-amber-50 text-amber-700 px-3 py-1.5 rounded-full border border-amber-200">
                    <span id="status-dot" class="h-2.5 w-2.5 bg-amber-500 rounded-full animate-pulse"></span>
                    <span id="status-texto">Conectando...</span>
                </span>
                <span id="badge-alertas" class="flex items-center gap-1.5 bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full border border-gray-200">
                    <i class="fa-solid fa-bell"></i>
                    <span id="qtd-alertas">0</span> Alertas Ativos
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="erro-conexao" class="hidden mb-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"></div>

        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Total Lixeiras</p>
                    <h3 id="metric-total" class="text-3xl font-bold text-gray-900 mt-1">0</h3>
                </div>
                <div class="bg-blue-50 text-blue-600 p-4 rounded-lg"><i class="fa-solid fa-dumpster text-2xl"></i></div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Críticas (&gt;80%)</p>
                    <h3 id="metric-criticas" class="text-3xl font-bold text-red-600 mt-1">0</h3>
                </div>
                <div class="bg-red-50 text-red-600 p-4 rounded-lg"><i class="fa-solid fa-triangle-exclamation text-2xl"></i></div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Ocupação Média</p>
                    <h3 id="metric-media" class="text-3xl font-bold text-gray-900 mt-1">0%</h3>
                </div>
                <div class="bg-purple-50 text-purple-600 p-4 rounded-lg"><i class="fa-solid fa-chart-pie text-2xl"></i></div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500 uppercase tracking-wider">Último Sinal</p>
                    <h3 id="metric-tempo" class="text-lg font-semibold text-gray-900 mt-2">--:--</h3>
                </div>
                <div class="bg-gray-50 text-gray-600 p-4 rounded-lg"><i class="fa-solid fa-clock-rotate-left text-2xl"></i></div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <section class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-green-600"></i> Status das Lixeiras
                </h2>
                <div id="lista-lixeiras" class="space-y-5">
                    <p class="text-gray-500 text-sm py-4 text-center">Carregando dados das lixeiras...</p>
                </div>
            </section>

            <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col h-[500px]">
                <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-amber-500"></i> Alertas em Tempo Real
                </h2>
                <div id="feed-alertas" class="space-y-3 overflow-y-auto flex-1 pr-1 text-sm">
                    <div class="text-center text-gray-400 py-8">Nenhum evento registrado ainda.</div>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
